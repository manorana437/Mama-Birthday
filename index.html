<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Mama 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Serif+Display&family=Manrope:wght@400;600;700&family=Playfair+Display:ital,wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="stars"></div>

  <main class="app">
    <div class="topbar">
      <span>A LITTLE GIFT <b>♡</b></span>
      <button id="soundBtn" class="sound-btn">♪</button>
    </div>

    <section class="card">
      <div class="progress"><span id="progressBar"></span></div>
      <div id="screen"></div>
      <div class="footer">
        <span id="stepLabel">01 / 08</span>
        <span>FOR MY MAMA</span>
      </div>
    </section>

    <p class="made">made with love <span>♥</span></p>
  </main>

  <audio id="music" src="assets/birthday-music.m4a" loop preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
